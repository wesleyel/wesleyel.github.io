<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Homelab 请求分流示意图</title>
  <desc id="desc">请求先经过 DNS 和 Traefik，再按后端类型分别进入 Docker proxy 网络或通过 macvlan shim 访问宿主机服务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52635c"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <style>
      .bg{fill:#f6f5f1}.card{fill:#fff;stroke:#d7dedb;stroke-width:1.5;filter:url(#shadow)}.primary{fill:#17483d;stroke:#17483d}.diamond{fill:#e9f2ee;stroke:#9dbbb0;stroke-width:1.5}.lane{fill:#fff;stroke:#cfd8d4;stroke-width:1.4;stroke-dasharray:7 7}
      .title,.label,.small{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:28px;font-weight:700;fill:#17201d}.label{font-size:17px;font-weight:700;fill:#1e2925}.small{font-size:14px;font-weight:400;fill:#64716b}.light{fill:#fff}.light-small{fill:#d7e9e2}.arrow{fill:none;stroke:#52635c;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <text class="title" x="52" y="58">一次请求如何找到正确的服务</text>
  <text class="small" x="52" y="84">域名是入口，后端类型决定最后一段路</text>

  <rect class="card" x="52" y="132" width="170" height="86" rx="16"/>
  <text class="label" x="76" y="167">① 浏览器</text><text class="small" x="76" y="192">请求内网域名</text>
  <rect class="card" x="275" y="132" width="170" height="86" rx="16"/>
  <text class="label" x="299" y="167">② DNS</text><text class="small" x="299" y="192">返回统一入口</text>
  <rect class="card primary" x="498" y="132" width="190" height="86" rx="16"/>
  <text class="label light" x="522" y="167">③ Traefik</text><text class="small light-small" x="522" y="192">TLS 终止与 Host 匹配</text>
  <path class="arrow" d="M222 175 H263"/><path class="arrow" d="M445 175 H486"/>

  <polygon class="diamond" points="812,111 916,175 812,239 708,175"/>
  <text class="label" x="756" y="171">后端是什么？</text>
  <text class="small" x="773" y="194">按配置来源分流</text>
  <path class="arrow" d="M688 175 H696"/>

  <rect class="lane" x="52" y="300" width="1096" height="116" rx="20"/>
  <text class="label" x="78" y="331">普通容器</text>
  <text class="small" x="78" y="356">Compose labels</text>
  <rect class="card" x="288" y="318" width="210" height="78" rx="14"/>
  <text class="label" x="312" y="350">Docker provider</text><text class="small" x="312" y="374">自动发现路由</text>
  <rect class="card" x="585" y="318" width="180" height="78" rx="14"/>
  <text class="label" x="609" y="350">proxy 网络</text><text class="small" x="609" y="374">只传应用流量</text>
  <rect class="card" x="852" y="318" width="246" height="78" rx="14"/>
  <text class="label" x="876" y="350">应用容器</text><text class="small" x="876" y="374">Homepage / 下载 / 代理等</text>
  <path class="arrow" d="M812 239 V274 H393 V306"/>
  <path class="arrow" d="M498 357 H573"/><path class="arrow" d="M765 357 H840"/>
  <text class="small" x="700" y="269">容器</text>

  <rect class="lane" x="52" y="462" width="1096" height="116" rx="20"/>
  <text class="label" x="78" y="493">宿主机服务</text>
  <text class="small" x="78" y="518">显式配置</text>
  <rect class="card" x="288" y="480" width="210" height="78" rx="14"/>
  <text class="label" x="312" y="512">file provider</text><text class="small" x="312" y="536">手工声明后端</text>
  <rect class="card" x="585" y="480" width="180" height="78" rx="14"/>
  <text class="label" x="609" y="512">macvlan shim</text><text class="small" x="609" y="536">跨过隔离边界</text>
  <rect class="card" x="852" y="480" width="246" height="78" rx="14"/>
  <text class="label" x="876" y="512">NAS / host 网络</text><text class="small" x="876" y="536">DSM、Home Assistant 等</text>
  <path class="arrow" d="M916 175 H1122 V437 H393 V468"/>
  <path class="arrow" d="M498 519 H573"/><path class="arrow" d="M765 519 H840"/>
  <text class="small" x="1082" y="269">宿主机</text>

  <text class="small" x="52" y="608">两条路径共用同一套域名与证书，差别只在 Traefik 到后端的最后一跳。</text>
</svg>
