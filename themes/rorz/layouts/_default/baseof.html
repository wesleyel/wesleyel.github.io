<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" data-theme="{{ .Site.Params.colorScheme.default | default "auto" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <div class="site-shell">
    <div class="shell-grid">
      <div class="col-sidebar">
        {{- partial "sidebar.html" . -}}
      </div>
      <main class="col-main" id="main">
        {{- block "main" . }}{{- end }}
      </main>
      {{- partial "theme-toggle.html" . -}}
    </div>
    {{- partial "footer.html" . -}}
  </div>
  {{- partial "scripts.html" . -}}
</body>
</html>
